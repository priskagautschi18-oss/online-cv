<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Password entry for the curriculum vitae of Priska Jenny Gautschi">
  <meta name="robots" content="noindex, nofollow">

  <title>CV Login - Priska Jenny Gautschi</title>

  <link rel="stylesheet" href="login.css">
  <script src="login.js" defer></script>
</head>

<body class="login-page">
  <main class="login-main">
    <section class="login-card" aria-labelledby="login-title">
      <p class="login-eyebrow">
        Curriculum Vitae
      </p>

      <h1 id="login-title">
        Welcome
      </h1>

      <p>
        Please enter the access password to open the application website.
      </p>

      <form class="login-form" id="login-form">
        <label for="password">
          Password
        </label>

        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required>

        <button type="submit">
          Open CV
        </button>

        <output
          class="login-status"
          id="login-status"
          aria-live="polite">
        </output>
      </form>

      <noscript>
        JavaScript must be enabled to use the password redirect.
      </noscript>
    </section>
  </main>

  <footer class="login-footer">
    <p>&copy; 2026 Priska Jenny Gautschi</p>
  </footer>
</body>

</html>
